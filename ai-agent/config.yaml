name: AI Agent
version: "0.1.0"
slug: ai_agent
description: Periodically queries an AI provider (Gemini, Claude, or ChatGPT) and writes the response back into Home Assistant.
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: application
boot: auto
hassio_api: true
homeassistant_api: true
options:
  log_level: info
  interval_seconds: 300
  provider: claude
  api_key: ""
  model: ""
  max_tokens: 1024
  system_prompt: ""
  prompt: ""
  result_entity: sensor.ai_agent_result
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  interval_seconds: int(10,)
  provider: list(gemini|claude|openai|openrouter)
  api_key: str
  model: str?
  max_tokens: int(1,)
  system_prompt: str?
  prompt: str
  result_entity: str?
